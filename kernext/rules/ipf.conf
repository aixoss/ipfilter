# =============================================================================
# ipf.conf — Production-realistic STATEFUL ruleset for Secure Workload agent
#
# PURPOSE
# -------
# Simulates the IPFilter ruleset pushed by the Cisco Secure Workload (Tetration)
# agent onto an AIX host.  This ruleset models the actual production workload:
#
#   STATEFUL — TCP pass rules use "keep state".  Once a connection is
#               established, all subsequent packets (including return traffic)
#               are permitted via the state table (fr_stlookup / fr_checkstate)
#               without re-traversing the rule list.  This is the dominant
#               production pattern.
#
#   FILTER-ONLY — no NAT, no proxy_auth, no icmp-type replies, no keep frags.
#
#   RETURN TRAFFIC — with "keep state" active, explicit paired "pass out port >
#               1023" rules are NOT needed for TCP sessions.  They are omitted.
#               The state table handles all return packets automatically.
#               UDP rules also carry "keep state" for consistency with production.
#
#   PREAMBLE BLOCKS — the early-exit block rules (deny-list, loopback, IP
#               options, bad TCP flags) are stateless — block rules never use
#               keep state.
#
#   POOL REFERENCES — every pass rule references exactly TWO pools (src + dst),
#               generating 2 pool lookups per rule evaluation on the FIRST
#               packet of each new connection.  Subsequent packets of established
#               connections bypass pool lookups entirely via the state table.
#
#   RULE COUNT — ~150 rules total (down from ~250 stateless).  Removing paired
#               return-traffic rules roughly halves the pass-rule count.
#     1. Preamble (early-exit blocks) — ~10 rules, stateless
#     2. Core stateful allow rules — ~140 rules (pass in ... keep state)
#     3. Tail default-deny — block in/out all
#
#   TRAFFIC ASSUMPTIONS (test environment)
#     Test packets:  source 18.0.0.10 (in pool 100), destination 18.0.0.20 (in pool 101)
#     Protocol:      TCP, port 8080 (destination/server port; netperf listens here)
#     Interface:     en0
#     Sessions:      800 concurrent netperf TCP_RR sessions; each session uses an
#                    ephemeral source port (>1023) assigned by the OS on the client.
#                    The "keep state" rule captures the full 5-tuple on the first SYN
#                    (src=18.0.0.10, ephemeral_src_port, dst=18.0.0.20, dport=8080).
#                    Subsequent packets in each session (ACK/data/FIN) are matched by
#                    the state table entry — no rule re-evaluation needed.
#                    Explicit "pass out port > 1023" return-traffic rules are therefore
#                    NOT required; the state table handles return traffic automatically.
#     First packet:  traverses preamble (~10 rules) + ~30 group-A rules → group-B rules
#                    → matches B-3 (port 8080) → state entry created.
#     Repeat packets: hit fr_checkstate → fr_stlookup → state-table hit → PASS
#                    without touching pool lookups or rule scan at all.
#
#   POOL USAGE IN THIS FILE (all type=tree from ippool.conf):
#     pool/100  client-hosts  (28 entries)
#     pool/101  app-servers   (22 entries)
#     pool/102  db-servers    (18 entries)
#     pool/103  mgmt-hosts    (12 entries)
#     pool/104  build-agents  (10 entries)
#     pool/105  trusted-nets  ( 8 entries)
#     pool/106  deny-list     (25 entries)
#     pool/107  partner-nets  (16 entries)
#     pool/108  scanner-hosts ( 6 entries)
#     pool/109  local-loopback( 4 entries)
#
#   OPT25/28 NOTE: All pools have multiple entries; the /32 single-entry
#   fastpath (OPT25) NEVER fires.  All pool lookups go through rnh_matchaddr.
#
#   OPT9 NOTE: "keep state" IS used on TCP/UDP pass rules.  fr_stlookup() IS
#   called on every packet of an established session.  OPT9 (improved state
#   hash) is ACTIVE and relevant in this workload.
#
#   OPT26/27 NOTE: Pool memoization cache is only exercised on the first packet
#   of each new connection (new-state path through rule scan).  For established
#   sessions the cache is bypassed entirely (state-table hit before rule scan).
#   The cache benefit is therefore limited to connection-establishment packets.
#
#   IPSTATE_SIZE NOTE: With 800 sessions running TCP_RR, the state table will
#   hold ~800–1600 active entries (one per direction per connection).  Ensure
#   the state table is sized adequately:
#     ndd -set /dev/ipf ipf_state_max 32768
#     ndd -set /dev/ipf ipf_state_size 32768
#
# Load with:
#   ippool -F && ippool -f /etc/ippool.conf
#   ipf -F a && ipf -f /etc/ipf.conf
#
# Verify with:
#   ipfstat -io        (rule hit counts)
#   ipfstat -s         (state table summary)
# =============================================================================


# =============================================================================
# PREAMBLE — Early-exit STATELESS block rules (~10 rules)
#
# These rules match known-bad sources and spoofed addresses.  They appear first
# so malicious traffic is dropped before any state lookup or rule scan.
# Block rules are always stateless — "keep state" must NOT be used with block.
#
# OPT23/OPT24 effect: all six fr_ipfcheck early-exit conditions are exercised
# across these rules on non-matching traffic.  Branch hints reduce mispredict
# penalty on the "not matching" fallthrough path.
#
# OPT26/27 effect: pool 106 (deny-list) appears in two rules — the second
# reference is a cache HIT.  Pool 109 (local-loopback) appears in one rule.
# Total distinct pools in preamble: 2 (106, 109).
# =============================================================================

# P-1: Drop spoofed loopback/link-local source addresses (pool 109)
block in  quick on en0 proto tcp  from pool/109 to any
block in  quick on en0 proto udp  from pool/109 to any

# P-2: Drop known-bad source addresses (pool 106, deny-list)
block in  quick on en0 proto tcp  from pool/106 to any
block in  quick on en0 proto udp  from pool/106 to any
block in  quick on en0 proto icmp from pool/106 to any

# P-3: Drop deny-list as destination too (pool 106 second reference — cache HIT)
block out quick on en0 proto tcp  from any to pool/106
block out quick on en0 proto udp  from any to pool/106

# P-4: Drop all IP options (common security hardening)
block in  quick on en0 proto tcp all with ipopts
block in  quick on en0 proto udp all with ipopts

# P-5: Drop null/invalid TCP flag combinations
block in  quick on en0 proto tcp all flags FUP/FUP
block in  quick on en0 proto tcp all flags /FSRPAU


# =============================================================================
# GROUP A — Management and monitoring access (~15 rules, stateful)
#
# Rules permitting SSH, SNMP, syslog, metrics scraping, and agent-plane traffic
# between the management hosts (pool 103) and all tiers.
#
# Pattern: pass in ... keep state
# Return traffic is handled automatically by the state table.
# No paired "pass out" rules needed.
#
# OPT9 effect: fr_stlookup() is called on every packet of each established
# session.  The improved 64-bit XOR hash (OPT9) reduces bucket collisions.
#
# OPT26/27 effect on FIRST packet only:
#   Source pool 103 → first rule is a miss; subsequent rules in this group HIT.
#   Destination pools rotate (101, 102, 100) → each first reference is a miss.
# =============================================================================

# A-1: SSH from mgmt to app-servers (src: pool/103, dst: pool/101)
pass  in  quick on en0 proto tcp from pool/103 to pool/101 port = 22   keep state

# A-2: SSH from mgmt to db-servers (src: pool/103, dst: pool/102)
pass  in  quick on en0 proto tcp from pool/103 to pool/102 port = 22   keep state

# A-3: SSH from mgmt to client-hosts (src: pool/103, dst: pool/100)
pass  in  quick on en0 proto tcp from pool/103 to pool/100 port = 22   keep state

# A-4: HTTPS from mgmt to app-servers (monitoring dashboards)
pass  in  quick on en0 proto tcp from pool/103 to pool/101 port = 443  keep state

# A-5: HTTPS from mgmt to db-servers
pass  in  quick on en0 proto tcp from pool/103 to pool/102 port = 443  keep state

# A-6: Prometheus metrics scrape (9090) from mgmt to app-servers
pass  in  quick on en0 proto tcp from pool/103 to pool/101 port = 9090 keep state

# A-7: Prometheus metrics scrape (9090) from mgmt to db-servers
pass  in  quick on en0 proto tcp from pool/103 to pool/102 port = 9090 keep state

# A-8: SNMP traps (UDP 162) from app-servers to mgmt
pass  in  quick on en0 proto udp from pool/101 to pool/103 port = 162  keep state

# A-9: SNMP traps (UDP 162) from db-servers to mgmt
pass  in  quick on en0 proto udp from pool/102 to pool/103 port = 162  keep state

# A-10: Syslog (UDP 514) from app-servers to mgmt
pass  in  quick on en0 proto udp from pool/101 to pool/103 port = 514  keep state

# A-11: Syslog (UDP 514) from db-servers to mgmt
pass  in  quick on en0 proto udp from pool/102 to pool/103 port = 514  keep state

# A-12: Tetration agent (TCP 443) from app-servers to mgmt
pass  in  quick on en0 proto tcp from pool/101 to pool/103 port = 443  keep state

# A-13: Tetration agent from db-servers to mgmt
pass  in  quick on en0 proto tcp from pool/102 to pool/103 port = 443  keep state

# A-14: NTP (UDP 123) — all tiers to mgmt
pass  in  quick on en0 proto udp from pool/101 to pool/103 port = 123  keep state
pass  in  quick on en0 proto udp from pool/102 to pool/103 port = 123  keep state
pass  in  quick on en0 proto udp from pool/100 to pool/103 port = 123  keep state


# =============================================================================
# GROUP B — Client-to-application inbound (~23 rules, stateful)
#
# The main inbound allow block: client-hosts (pool 100) connecting to
# app-servers (pool 101) on the various application ports.
# "keep state" allows return traffic without explicit pass-out rules.
#
# Pattern: pass in ... from pool/100 to pool/101 port = P keep state
#
# First packet of each new connection: traverses preamble + group A + first
# matching group-B rule, then creates a state entry.
# Subsequent packets of that connection: hit state table immediately.
#
# The test traffic (src=18.0.0.10, dst=18.0.0.20, port=8080) matches rule
# B-3 below — first SYN traverses preamble (~10 rules) + group A (~30 rules)
# + rules B-1 (port 80) and B-2 (port 443) before matching B-3 (port 8080).
# With 800 sessions using ephemeral source ports, all 800 state entries are
# created on the first SYN of each session; all subsequent packets are resolved
# by the state table (fr_checkstate / fr_stlookup) without re-entering rule scan.
# =============================================================================

# B-1 to B-15: TCP inbound from client-hosts to app-servers
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 80    keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 443   keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 8080  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 8443  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 8000  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 8001  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 8008  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 8009  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 9000  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 9001  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 9200  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 9300  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 6379  keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 11211 keep state
pass  in  quick on en0 proto tcp from pool/100 to pool/101 port = 15672 keep state

# B-16 to B-23: UDP inbound from client-hosts to app-servers
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 53   keep state
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 514  keep state
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 8125 keep state
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 8126 keep state
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 9999 keep state
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 4789 keep state
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 6081 keep state
pass  in  quick on en0 proto udp from pool/100 to pool/101 port = 7946 keep state


# =============================================================================
# GROUP C — Application-to-database (~20 rules, stateful)
#
# App-servers (pool 101) connecting to db-servers (pool 102).
# Pattern: pass in ... from pool/101 to pool/102 port = P keep state
# =============================================================================

# C-1 to C-10: TCP from app-servers to db-servers
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 5432  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 3306  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 1521  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 27017 keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 27018 keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 6379  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 9042  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 9160  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 5000  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 5001  keep state

# C-11 to C-20: TCP from app-servers to db-servers (continued)
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 7000  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 7001  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 2181  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 2888  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 3888  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 9092  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 9093  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 2049  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 4443  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/102 port = 8888  keep state


# =============================================================================
# GROUP D — Build-agent access to app tier (~10 rules, stateful)
#
# Build-agents (pool 104) need to reach app-servers (pool 101) for deployment
# and integration tests.  Pool 104 is small (10 /32 hosts) but still
# multi-entry — OPT25 does not fire.
# =============================================================================

# D-1 to D-5: TCP from build-agents to app-servers
pass  in  quick on en0 proto tcp from pool/104 to pool/101 port = 80    keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/101 port = 443   keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/101 port = 8080  keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/101 port = 8443  keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/101 port = 9000  keep state

# D-6 to D-10: TCP from build-agents to db-servers (test DB access)
pass  in  quick on en0 proto tcp from pool/104 to pool/102 port = 5432  keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/102 port = 3306  keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/102 port = 27017 keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/102 port = 6379  keep state
pass  in  quick on en0 proto tcp from pool/104 to pool/102 port = 9042  keep state


# =============================================================================
# GROUP E — Scanner access (~9 rules, stateful)
#
# Vulnerability scanners (pool 108) are allowed to reach both app and db tiers
# on specific ports for security scanning.
# =============================================================================

pass  in  quick on en0 proto tcp from pool/108 to pool/101 port = 80   keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/101 port = 443  keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/101 port = 8080 keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/101 port = 22   keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/102 port = 5432 keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/102 port = 3306 keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/102 port = 22   keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/100 port = 22   keep state
pass  in  quick on en0 proto tcp from pool/108 to pool/100 port = 80   keep state


# =============================================================================
# GROUP F — Partner network access (~13 rules, stateful)
#
# External partner networks (pool 107) are allowed to reach specific
# public-facing application ports on app-servers (pool 101).
# =============================================================================

# F-1 to F-7: TCP from partner-nets to app-servers
pass  in  quick on en0 proto tcp from pool/107 to pool/101 port = 443   keep state
pass  in  quick on en0 proto tcp from pool/107 to pool/101 port = 8443  keep state
pass  in  quick on en0 proto tcp from pool/107 to pool/101 port = 8080  keep state
pass  in  quick on en0 proto tcp from pool/107 to pool/101 port = 80    keep state
pass  in  quick on en0 proto tcp from pool/107 to pool/101 port = 9443  keep state
pass  in  quick on en0 proto tcp from pool/107 to pool/101 port = 7443  keep state
pass  in  quick on en0 proto tcp from pool/107 to pool/101 port = 6443  keep state

# F-8 to F-13: UDP from partner-nets to app-servers
pass  in  quick on en0 proto udp from pool/107 to pool/101 port = 4789  keep state
pass  in  quick on en0 proto udp from pool/107 to pool/101 port = 6081  keep state
pass  in  quick on en0 proto udp from pool/107 to pool/101 port = 8472  keep state
pass  in  quick on en0 proto udp from pool/107 to pool/101 port = 51820 keep state
pass  in  quick on en0 proto udp from pool/107 to pool/101 port = 500   keep state
pass  in  quick on en0 proto udp from pool/107 to pool/101 port = 4500  keep state


# =============================================================================
# GROUP G — Trusted-network broad-access rules (~10 rules, stateful)
#
# Trusted corporate subnets (pool 105) get a broader set of port access.
# Pool 105 contains wide CIDRs (/8, /12, /16); the radix traversal is
# shallow — these ranges are matched quickly.
# =============================================================================

# G-1 to G-5: TCP from trusted-nets to app-servers
pass  in  quick on en0 proto tcp from pool/105 to pool/101 port = 80    keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/101 port = 443   keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/101 port = 8080  keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/101 port = 8443  keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/101 port = 9000  keep state

# G-6 to G-10: TCP from trusted-nets to db-servers
pass  in  quick on en0 proto tcp from pool/105 to pool/102 port = 5432  keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/102 port = 3306  keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/102 port = 27017 keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/102 port = 6379  keep state
pass  in  quick on en0 proto tcp from pool/105 to pool/102 port = 9042  keep state


# =============================================================================
# GROUP H — Inter-app-server east-west traffic (~10 rules, stateful)
#
# App-servers talking to other app-servers (pool 101 → pool 101).
# Both src and dst pool are the SAME pointer → after the first rule the
# same cache slot covers both src and dst lookups.
# =============================================================================

pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 8080  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 8443  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 9000  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 2379  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 2380  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 6443  keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 10250 keep state
pass  in  quick on en0 proto tcp from pool/101 to pool/101 port = 10255 keep state
pass  in  quick on en0 proto udp from pool/101 to pool/101 port = 8472  keep state
pass  in  quick on en0 proto udp from pool/101 to pool/101 port = 4789  keep state


# =============================================================================
# DEFAULT POLICY — must be LAST
# Block all traffic not explicitly permitted.
# Return traffic from established sessions is handled by the state table
# (fr_checkstate) before reaching these rules.
# =============================================================================
block in  all
block out all
